<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotify Ad Helper</title>
  <style>
    body { width: 280px; margin: 0; padding: 16px; font: 14px/1.45 system-ui, sans-serif; color: #f5f5f5; background: #202020; }
    h1 { margin: 0 0 8px; font-size: 17px; }
    p { margin: 8px 0; color: #d0d0d0; }
    .tag { display: inline-block; padding: 4px 8px; border-radius: 999px; background: #304b37; color: #baf2c8; font-size: 12px; }
    a { color: #9be7b0; }
  </style>
</head>
<body>
  <h1>Spotify Ad Helper</h1>
  <span class="tag">Diagnostic prototype</span>
  <p>This extension displays visible player metadata on Spotify Web Player.</p>
  <p>It does not bypass ads or guarantee ad detection. Spotify's page structure may change.</p>
  <p>Open <a href="https://open.spotify.com/" target="_blank" rel="noreferrer">Spotify Web Player</a> to test it.</p>
</body>
</html>
