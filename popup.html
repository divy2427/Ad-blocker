<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Ad Helper</title>
  <style>
    body {
      width: 280px;
      padding: 16px;
      margin: 0;
      background: #171717;
      color: #f5f5f5;
      font: 14px/1.5 Arial, sans-serif;
    }
    h2 {
      margin: 0 0 10px;
      color: #ff7777;
      font-size: 18px;
    }
    p { margin: 8px 0; }
    .hint {
      padding: 10px;
      border-radius: 8px;
      background: #292929;
    }
    a { color: #8ab4f8; }
  </style>
</head>
<body>
  <h2>Music Ad Helper</h2>
  <p>Designed for YouTube Music.</p>
  <div class="hint">
    Keep YouTube Music open to use the on-page diagnostic panel.
    Available Skip controls may be clicked automatically.
  </div>
  <p>Skipping is not guaranteed for every ad.</p>
  <p><a href="https://music.youtube.com/" target="_blank">
    Open YouTube Music
  </a></p>
</body>
</html>
